name: Probe
on:
  push:
    branches: [main]
    paths: ['pipeline/tools/probe.py']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python pipeline/tools/probe.py out/samples
      - if: always()
        run: |
          cd out && git init -q -b probe
          git config user.name "hockey-bot" && git config user.email "hockey-bot@users.noreply.github.com"
          git add -A && git commit -q -m "probe"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
