name: Probe NHL API
on:
  push:
    branches: [main]
    paths: ['pipeline/probe.py', '.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download samples
        run: python pipeline/probe.py out/samples
      - name: Publish to data branch
        if: always()
        run: |
          cd out
          git init -q -b data
          git config user.name "hockey-bot"
          git config user.email "hockey-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Probe samples"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
